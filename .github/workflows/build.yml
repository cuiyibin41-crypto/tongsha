name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true
            $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains classes
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'com/adkiller/AdKillerHook'; then
            echo "VERIFY OK: classes found in dex"
          else
            echo "VERIFY FAIL: classes NOT in dex"; exit 1
          fi
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'com/adkiller/MainActivity'; then
            echo "VERIFY OK: MainActivity found"
          else
            echo "VERIFY FAIL: MainActivity NOT in dex"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdKiller-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
